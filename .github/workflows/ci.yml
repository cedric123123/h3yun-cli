name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: go.sum
      - name: Verify modules
        run: go mod verify
      - name: Run tests
        run: go test ./... -count=1 -cover
      - name: Run static analysis
        run: go vet ./...
      - name: Run race detector
        if: runner.os == 'Linux'
        run: go test -race ./... -count=1

  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Scan reachable Go vulnerabilities
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: 1.27.2
          go-package: ./...

  build:
    name: Cross-platform build
    needs: [test, vulnerability-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: go.sum
      - name: Build Windows, Linux, and macOS binaries
        run: sh scripts/build.sh
      - name: Package and verify release files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/h3yun-release"
          go run ./scripts/package -root . -out "$RUNNER_TEMP/h3yun-release"
          sha256sum --check "$RUNNER_TEMP/h3yun-release/SHA256SUMS"
      - name: Inspect embedded build metadata
        run: |
          go version -m dist/h3yun.exe
          go version -m dist/h3yun-linux-amd64
          go version -m dist/h3yun-darwin-arm64
          go version -m dist/h3yun-darwin-amd64
