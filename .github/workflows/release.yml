name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: true
          cache-dependency-path: go.sum
      - name: Check tag and source version
        shell: bash
        run: |
          version=$(go run ./cmd/h3yun version | jq -r '.data.version')
          test "$GITHUB_REF_NAME" = "v$version"
          test -z "$(git status --porcelain)"
      - name: Verify modules
        run: go mod verify
      - name: Run tests
        run: go test ./... -count=1 -cover
      - name: Run static analysis
        run: go vet ./...
      - name: Scan reachable Go vulnerabilities
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: 1.27.2
          go-package: ./...
          repo-checkout: false
      - name: Build release binaries
        run: sh scripts/build.sh
      - name: Package release files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/h3yun-release"
          go run ./scripts/package -root . -out "$RUNNER_TEMP/h3yun-release"
          cd "$RUNNER_TEMP/h3yun-release"
          sha256sum --check SHA256SUMS
      - name: Verify embedded metadata
        shell: bash
        run: |
          for file in dist/h3yun.exe dist/h3yun-linux-amd64 dist/h3yun-darwin-arm64 dist/h3yun-darwin-amd64; do
            go version -m "$file" | tee /dev/stderr | grep -F "vcs.modified=false"
            go version -m "$file" | grep -F "vcs.revision=$GITHUB_SHA"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "$RUNNER_TEMP"/h3yun-release/*
          --verify-tag
          --title "h3yun CLI $GITHUB_REF_NAME"
          --generate-notes
